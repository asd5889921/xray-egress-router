[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xray-egress-router"
version = "0.1.0"
description = "Xray TPROXY egress routing layered on an existing Panabit L2TP ingress"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "bcrypt>=4.1,<5",
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<9", "pytest-asyncio>=0.23,<1"]

[project.scripts]
xrer-web = "l2tp_multi_egress.main:run"
xrer-watchdog = "l2tp_multi_egress.watchdog:run"
xrer-ppp-event = "l2tp_multi_egress.ppp_event:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
l2tp_multi_egress = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
